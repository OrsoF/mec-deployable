<svg xmlns="http://www.w3.org/2000/svg" width="960" height="950" viewBox="0 0 960 950" role="img" aria-labelledby="title desc">
<title id="title">Decision pipeline and training boundary</title><desc id="desc">CLI and HTTP inputs enter static or temporal decision engines. Engines reuse Problem, Solution, PathCatalog and assess. Optional PPO checkpoints are produced offline. Feasibility is checked before JSON export. Temporal clients persist next_previous; the demo applies no network actions.</desc>
<defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f82"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563a6"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#a55b0b"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#52657b"/></marker></defs>
<rect width="960" height="950" rx="16" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="24" y="38" font-size="17" fill="#087f82" font-weight="700" text-anchor="start">SOFTWARE ARCHITECTURE</text>
<text x="24" y="76" font-size="34" fill="#142d4e" font-weight="700" text-anchor="start">One shared constraint model</text>
<rect x="24" y="100" width="912" height="114" rx="12" fill="#f2f6fa" stroke="#c5d1de"/>
<text x="42" y="131" font-size="22" fill="#142d4e" font-weight="700" text-anchor="start">01 / Network input</text>
<text x="42" y="160" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">CLI + HTTP JSON → instance_io.py / dynamics.py</text>
<text x="42" y="187" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Static instance or current observations + public forecasts</text>
<rect x="24" y="240" width="444.0" height="170" rx="12" fill="#f2f6fa" stroke="#c5d1de"/>
<text x="42" y="271" font-size="22" fill="#142d4e" font-weight="700" text-anchor="start">02 / Static engine</text>
<text x="42" y="300" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">inference.py · DecisionEngine</text>
<text x="42" y="327" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Greedy / lookahead / multistart</text>
<text x="42" y="354" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Optional PPO · feasible edits</text>
<text x="42" y="381" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">auto: best feasible throughput</text>
<rect x="492.0" y="240" width="444.0" height="170" rx="12" fill="#f2f6fa" stroke="#c5d1de"/>
<text x="510.0" y="271" font-size="22" fill="#142d4e" font-weight="700" text-anchor="start">02 / Temporal engine</text>
<text x="510.0" y="300" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">temporal_inference.py</text>
<text x="510.0" y="327" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Keep / greedy / myopic / beam MPC</text>
<text x="510.0" y="354" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Optional PPO · one action/period</text>
<text x="510.0" y="381" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">auto: best immediate stage reward</text>
<path d="M246.0 214 L246.0 238" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#gray)"/>
<path d="M714.0 214 L714.0 238" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#gray)"/>
<rect x="24" y="430" width="912" height="95" rx="12" fill="#e0f1f0" stroke="#c5d1de"/>
<text x="42" y="461" font-size="22" fill="#087f82" font-weight="700" text-anchor="start">Shared domain + feasibility primitives</text>
<text x="42" y="490" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">problem.py · paths.py · constraints.assess</text>
<text x="42" y="513" font-size="16" fill="#52657b" font-weight="400" text-anchor="start">Optional exact.py: tiny-instance MILP (SciPy)</text>
<rect x="24" y="542" width="912" height="108" rx="12" fill="#f2f6fa" stroke="#c5d1de"/>
<text x="42" y="573" font-size="22" fill="#2563a6" font-weight="700" text-anchor="start">Offline training → trusted checkpoints</text>
<text x="42" y="602" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">train.py / train_temporal.py → environments → SB3 PPO</text>
<text x="42" y="629" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">model.zip + vecnormalize.pkl + metadata.json</text>
