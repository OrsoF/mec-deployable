<path d="M480.0 325 L492.0 325" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#blue)"/>
<path d="M948 325 L948 724" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M936 325 L948 325" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M246.0 410 L246.0 418" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M246.0 418 L948 418" fill="none" stroke="#52657b" stroke-width="2"/>
<path d="M948 724 L934 724" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#gray)"/>
<rect x="24" y="668" width="912" height="112" rx="12" fill="#e0f1f0" stroke="#c5d1de"/>
<text x="42" y="699" font-size="22" fill="#087f82" font-weight="700" text-anchor="start">03 / Validate before export</text>
<text x="42" y="728" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">CPU · directed bandwidth · integer bounds · loaded latency</text>
<text x="42" y="755" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Static auto: explicit baseline fallback on PPO failure</text>
<path d="M480.0 780 L480.0 804" fill="none" stroke="#52657b" stroke-width="2" marker-end="url(#gray)"/>
<rect x="24" y="806" width="912" height="110" rx="12" fill="#f2f6fa" stroke="#c5d1de"/>
<text x="42" y="837" font-size="22" fill="#142d4e" font-weight="700" text-anchor="start">04 / Decision JSON</text>
<text x="42" y="866" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">solution_io.py · placements / routes / Mbps / provenance</text>
<text x="42" y="893" font-size="18" fill="#52657b" font-weight="400" text-anchor="start">Temporal: next_previous → client persists switching state</text>
<text x="24" y="931" font-size="16" fill="#52657b" font-weight="400" text-anchor="start">Temporal invalid proposals: feasible fallback. No network actuation.</text>
</g></svg>
