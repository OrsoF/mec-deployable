<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="674" viewBox="0 0 1040 674" role="img" aria-labelledby="title desc">
<title id="title">PPO placement, routing and bandwidth allocation</title><desc id="desc">Offline training produces a saved PPO policy. Inference uses a sequence of validated edits and exports the best feasible state. A manual, validated example places video analytics on the north edge and telemetry on the south edge. Two of four demand routes are highlighted. This illustration is not a PPO evaluation or a measured policy result.</desc>
