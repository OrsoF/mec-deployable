<title id="title">PPO for edge-network decisions</title><desc id="desc">A real synthetic topology supplies traffic and computing resources. Offline PPO training produces a policy. At inference the policy proposes placement, routing and bandwidth edits; feasibility is checked before JSON output. No measured placement result is shown.</desc>
